<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 5</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      .row-fixed-height {
        height: 250px;
      }
    </style>
  </head>
  <body>
    <div class="container row-fixed-height">
      <div
        class="row bg-light text-dark p-3 g-5 row-fixed-height align-items-start"
      >
        <div class="col row bg-primary h-50">Columna 1</div>
        <div class="col row bg-primary h-50">Columna 2</div>
        <div class="col row bg-primary h-50">Columna 3</div>
      </div>
      <div
        class="row bg-light text-dark p-3 g-5 row-fixed-height align-items-center"
      >
        <div class="col row bg-primary h-50">Columna 1</div>
        <div class="col row bg-primary h-50">Columna 2</div>
        <div class="col row bg-primary h-50">Columna 3</div>
      </div>
      <div
        class="row bg-light text-dark p-3 g-5 row-fixed-height align-items-end"
      >
        <div class="col row bg-primary h-50">Columna 1</div>
        <div class="col row bg-primary h-50">Columna 2</div>
        <div class="col row bg-primary h-50">Columna 3</div>
      </div>
      <div class="row bg-light text-dark p-3 g-5 row-fixed-height">
        <div class="col row bg-primary h-50 align-self-start">Columna 1</div>
        <div class="col row bg-primary h-50 align-self-center">Columna 2</div>
        <div class="col row bg-primary h-50 align-self-end">Columna 3</div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
