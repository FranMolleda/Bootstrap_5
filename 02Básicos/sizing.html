<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing Bootstrap 5</title>
       <!-- Bootstrap CSS -->
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
       <style>
        #width {   
            background-color: cornflowerblue;
        }
       #width div {
            background-color: rgb(5, 33, 86);
            border: 2px solid #fff;
            color: #fff;
        }
        #height {   
            height: 300px;
            background-color: rgb(248, 94, 143);
        }
       #height div {
        display:inline-block;
            background-color: rgb(73, 4, 10);
            border: 2px solid #fff;
            color: #fff;
        }
    </style>
</head>
<body>
<div id="width" class="container p-3 my-2">
    <div class="w-25 p-2 my-2">width 25%</div>
    <div class="w-50 p-2 my-2">width 50%</div>
    <div class="w-75 p-2 my-2">width 75%</div>
    <div class="w-100 p-2 my-2">width 100%</div>
    <div class="w-auto p-2 my-2">width auto</div>
    <div class="mw-100 p-2 my-2">max width 100%</div>
</div>
<div id="height" class="container p-3 mb-5">
    <div class="h-25 p-2 mx-2">height 25%</div>
    <div class="h-50 p-2 mx-2">height 50%</div>
    <div class="h-75 p-2 mx-2">height 75%</div>
    <div class="h-100 p-2 mx-2">height 100%</div>
    <div class="h-auto p-2 mx-2">height auto</div>
    <div class="mh-100 p-2 mx-2">max height 100%</div>
</div>

<div id="viewport" class="vw-100 vh-100" style="background-color: rgb(187, 124, 46);"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
